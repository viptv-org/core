name: Shared core and bindings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -p viptv-typegen
      - run: bash scripts/build-native-bindings.sh
      - name: Check generated source interfaces
        run: git diff --exit-code -- generated/typescript generated/kotlin generated/native-kotlin
      - name: Install matching WASM generator
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: bash scripts/build-wasm.sh
      - run: node scripts/test-wasm.mjs
      - run: npm ci --prefix packages/runtime --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck --prefix packages/runtime
      - run: npm test --prefix packages/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: core-bindings-${{ github.sha }}
          path: |
            generated/
            Cargo.lock
            DESIGN_REF
          retention-days: 14
