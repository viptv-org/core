name: Core checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: core checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Install the keyring build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Reject the browser WASM artifact
        run: |
          if [ -e generated/wasm ] || [ -e browser ]; then
            echo 'generated/wasm and browser/ must not exist: no current client consumes the browser WASM.' >&2
            exit 1
          fi
      - name: Test the workspace
        run: cargo test --workspace --all-features
      - name: Keep the OS secret store out of the default build
        run: |
          cargo check --locked -p viptv-core --features native,live-runtime,vsources-runtime --lib
          ! cargo tree --locked -p viptv-core -e normal --target x86_64-unknown-linux-gnu | grep -E 'keyring|dbus'
          ! cargo tree --locked -p viptv-core -e normal --features native --target x86_64-unknown-linux-gnu | grep -E 'keyring|dbus'
      - name: Regenerate the bindings
        run: |
          cargo run -p viptv-typegen
          cargo run -p viptv-typegen --bin engine
      - name: Fail on stale generated output
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
