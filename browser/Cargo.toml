# The browser shell compiles the owning Rust source directly. It has no copy of
# application policy and does not resolve the native SDK/keyring transport graph.
[package]
name = "viptv-core-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-2.0-only"

[workspace]

[lib]
name = "viptv_core"
path = "../crates/viptv-core/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
sha1 = "0.10.6"
unicode-normalization = "0.1.24"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
crux_core = "=0.20.0"
crux_http = "=0.20.0"
facet = "=0.46.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = "2"
thiserror = "2"
# Preserve the no-externref heap shim for Chrome87/TV browser compatibility.
wasm-bindgen = "=0.2.92"
js-sys = "=0.3.69"
web-sys = "=0.3.69"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native", "typegen", "facet_typegen"))'] }
