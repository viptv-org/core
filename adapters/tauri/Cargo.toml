[package]
name = "viptv-core-tauri"
description = "Native Tauri integration for the shared VIPTV core: core bridge commands and the SmartCast host adapter."
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false

[lib]
path = "lib.rs"

[dependencies]
viptv-core = { path = "../../crates/viptv-core", features = ["native"] }
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
url = "2"
